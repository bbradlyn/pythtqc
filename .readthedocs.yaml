# Read the Docs builds the documentation site from mkdocs.yml, strictly, as the
# gates do: a page left out of the navigation, a dead link or a dead anchor fails
# the build.  The site is the pages as written, nothing on it generated from the
# code, so the build installs MkDocs and the Material theme alone, at the
# versions the `docs` extra of pyproject.toml pins.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    install:
      - pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.5,<10"

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true
